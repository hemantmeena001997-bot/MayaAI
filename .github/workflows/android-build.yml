
name: MAYA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Sherpa ONNX
        run: |
          mkdir -p app/libs
          curl -fL https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar -o app/libs/sherpa-onnx-2.0.3.aar
          ls -lh app/libs/sherpa-onnx-2.0.3.aar
      - name: Download MAYA Wake Word Model
        run: |
          MODEL=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          mkdir -p app/src/main/assets/$MODEL
          curl -fL https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/$MODEL.tar.bz2 -o model.tar.bz2
          tar -xjf model.tar.bz2 -C app/src/main/assets/
          rm model.tar.bz2
      - name: Build MAYA APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAYA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
